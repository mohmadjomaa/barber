<nav class="custom-navbar" appLocalized>
  <div class="nav-shell">
    <a class="logo" routerLink="/" aria-label="North Barber home">
      <span class="logo-mark" aria-hidden="true">NB</span>
      <span>North Barber</span>
    </a>

    <div class="nav-actions">
      <div class="language-switcher" role="group" aria-label="Language selection">
        <button type="button" [class.active]="language.language() === 'en'" [attr.aria-pressed]="language.language() === 'en'" (click)="language.setLanguage('en')">English</button>
        <button type="button" [class.active]="language.language() === 'he'" [attr.aria-pressed]="language.language() === 'he'" (click)="language.setLanguage('he')">עברית</button>
      </div>
      <button
        *ngIf="lastBooking"
        type="button"
        class="secondary-button quick-book"
        (click)="repeatLastBooking()"
      >
        Book Same Again
      </button>
      <a class="primary-button nav-cta" routerLink="/services" (click)="startBooking()">Book Appointment</a>
    </div>
  </div>
</nav>
